# 애드센스 설정 (구글 애드센스 승인 후 입력)
adsense:
  enabled: false
  client: ""       # ca-pub-XXXXXXXXXXXXXXXX
  slot_top: ""     # 상단 광고 슬롯 ID
  slot_mid: ""     # 본문 중간 광고 슬롯 ID
  slot_bot: ""     # 하단 광고 슬롯 ID

# 방문자 카운터 설정 (https://www.goatcounter.com 무료 가입 후 사이트 코드 입력)
goatcounter:
  code: "junhaing"

author:
  name: "JunHaing"
  email: "monkey3039@gmail.com"

github_username: JunHaing

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
