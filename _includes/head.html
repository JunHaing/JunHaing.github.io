<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- title, description, Open Graph, canonical, 구조화 데이터는 jekyll-seo-tag가 생성 (직접 추가하면 중복됨) -->
{% seo %}
{% feed_meta %}

<link rel="sitemap" type="application/xml" href="/sitemap.xml">

<!-- 구글 애드센스 (승인 후 _config.yml에서 enabled: true로 변경) -->
{% if site.adsense.enabled %}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense.client }}" crossorigin="anonymous"></script>
{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
